name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check src tests tools
      - name: mypy --strict
        run: mypy
      - name: maintainability burn-down (must reach zero)
        run: python tools/maintainability.py check

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The package itself needs nothing compiled - no ROOT, no uproot, no
      # numpy - but the zstd extra is installed so that the accelerated path
      # is the one under test on every interpreter, rather than only on the
      # 3.14s that carry `compression.zstd` in the standard library.
      - run: pip install -e ".[dev,zstd]"
      # pytest-cov rather than `coverage run`, because the workers xdist
      # spawns are separate processes and only pytest-cov collects them all.
      # `fail_under = 100` comes from pyproject.toml, so the gate lives with
      # the configuration.
      - name: pytest
        run: >-
          pytest -q -p no:cacheprovider -n auto
          --cov=xrdroot --cov-report=term-missing

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[docs]"
      # --strict turns a broken link or a page missing from the nav into a
      # failure, which is the only way documentation stays true.
      - run: mkdocs build --strict
