name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check src tests tools
      - name: mypy --strict
        run: mypy
      - name: maintainability burn-down (must reach zero)
        run: python tools/maintainability.py check

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The package needs no ROOT and nothing compiled of its own, only NumPy;
      # the dev extra brings the libraries it hands data to and learns with, and
      # the zstd extra is installed so that the accelerated path is the one under
      # test on every interpreter, not only on the 3.14s that carry
      # `compression.zstd` in the standard library.
      # XGBoost's macOS wheels load libomp at import and do not bring it; the
      # runner has no OpenMP of its own, so TMVA's RBDT tests would not import.
      - if: runner.os == 'macOS'
        run: brew install libomp
      - run: pip install -e ".[dev,zstd]"
      # The installed single project is checked statically, then each component
      # is imported in its own -I child with higher imports blocked. This uses
      # the same NumPy/client/dev installation on Linux and macOS.
      - name: component contract
        run: python tools/components.py check --strict
      - name: fresh component imports
        run: >-
          python tools/components.py isolate
          cppstd core hist spectrum fits io rdf geom graphics roofit roostats
          histfactory tmva pyroot app
      # Each declared scope runs in its own child with every import above its
      # component blocked, and the root fixtures in play: a lower component's
      # tests must not be pulled up by what the suite shares. Ordinary pytest
      # below still runs the complete fixture tree.
      - name: pure C++ component tests
        run: python tools/components.py isolate cppstd --tests cppstd
      - name: core component tests
        run: python tools/components.py isolate core --tests core
      - name: histogram component tests
        run: python tools/components.py isolate hist --tests hist
      # pytest-cov rather than `coverage run`, because the workers xdist
      # spawns are separate processes and only pytest-cov collects them all.
      # `fail_under = 100` comes from pyproject.toml, so the gate lives with
      # the configuration.
      - name: pytest
        run: >-
          pytest -q -p no:cacheprovider -n auto
          --cov=xrdroot --cov-report=term-missing

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[docs]"
      # --strict turns a broken link or a page missing from the nav into a
      # failure, which is the only way documentation stays true.
      - run: mkdocs build --strict

  # The root build and installation smoke check the refactor must keep: the
  # project is one installable distribution, so what the built artifact puts on
  # a machine has to be all of it - nothing that only the editable install
  # supplied, no path back into the source tree. The wheel is built, installed
  # into a clean environment and exercised the way a user would.
  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - name: build the sdist and the wheel
        run: python -m build
      - name: install the wheel into a clean environment and use it
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install --quiet dist/*.whl
          cd /tmp
          /tmp/wheel-check/bin/python - <<'PY'
          import numpy as np

          import xrdroot

          edges = np.linspace(0.0, 1.0, 51)
          values = np.linspace(0.5, 4.5, 50)
          with xrdroot.create("wheel-check.root") as made:
              made["counts"] = xrdroot.Histogram.new("counts", edges, values)
              made["note"] = "written by the installed wheel"
          back = xrdroot.open_root("wheel-check.root")
          assert back.keys() == ["counts", "note"]
          assert back["counts"].values().sum() == values.sum()
          assert back["note"] == "written by the installed wheel"
          print("wheel check:", len(back), "object(s),", back["counts"].values().sum(), "counts")
          PY
          /tmp/wheel-check/bin/python -m xrdroot --help > /dev/null
