# What ROOT's suite holds that no macOS ARM64 machine can run, and why.
#
# Each [[label]] is a full-sentence reason and what it covers: `ids`, globs
# over test ids (`*` crosses `/`); `needs`, what discovery found a test needs
# ("dictionary", "executable"); or `setup`, the kind of ctest build step
# ("compiled-macro", "dictionary", "executable"). The first label covering a
# test is the one it is counted under, and labelled tests are not run.
#
# The suite is configured as on a Mac with Apple silicon (tools/rootsuite/
# machine.py), so ROOT's own CMake already leaves out what such a Mac cannot
# build - CUDA, SYCL, X11, io_uring, Vc, tests disabled on APPLE or arm64 - and
# those tests are not registered at all. These labels catch the same tests
# when `--features` turns such an option on anyway.
#
# Label only what a Mac with ROOT cannot run. Dictionaries, ACLiC, compiled
# executables, cling, reflection, cppyy, distributed RDataFrame and HTTP all
# run there, so their tests stay in scope: what xrdroot cannot yet do is
# UNSUPPORTED, FAIL or SKIP, and the ratchet measures it.

[[label]]
reason = "It needs a CUDA or SYCL device and toolchain, which macOS on Apple silicon does not have."
ids = ["*cuda*", "*Cuda*", "*CUDA*", "*cudnn*", "*Cudnn*", "*sycl*", "*SYCL*", "*genvectorx*"]

[[label]]
reason = "It needs X11, Linux's io_uring or the x86 Vc library, none of which ROOT builds on macOS for Apple silicon."
ids = ["*x11*", "*X11*", "*IoUring*", "*io_uring*", "*uring*", "*/vc/*", "*VcTest*"]
