# What a pure-Python ROOT does not set out to pass, and why.
#
# Each [[label]] is a full-sentence reason and what it covers: `ids`, globs
# over test ids (`*` crosses `/`); `needs`, what discovery found a test needs
# ("dictionary", "executable"); or `setup`, the kind of ctest build step
# ("compiled-macro", "dictionary", "executable"). The first label covering a
# test is the one it is counted under, and labelled tests are not run.
#
# Label only what is outside xrdroot by design. A test xrdroot fails today
# stays in scope: that failure is what the ratchet measures.

[[label]]
reason = "It needs a C++ dictionary generated by rootcling or genreflex for compiled classes, which a pure-Python ROOT has no compiler to build or load."
needs = ["dictionary"]
setup = ["dictionary"]

[[label]]
reason = "It is an ACLiC build step that compiles a macro into a shared library, which a pure-Python ROOT translates instead of compiling."
setup = ["compiled-macro"]
ids = ["roottest/root/aclic/*"]

[[label]]
reason = "It is a build step that compiles a C++ executable with a C++ compiler, which a pure-Python ROOT does not have."
setup = ["executable"]

[[label]]
reason = "It tests cling itself (dictionaries, reflection data, unloading, bytecode, thread safety and static initialisation of interpreted code), not what a macro computes."
ids = [
    "roottest/cling/dict/*", "roottest/cling/reflex/*", "roottest/cling/reload/*",
    "roottest/cling/bytecode/*", "roottest/cling/autoauto/*", "roottest/cling/threading/*",
    "roottest/cling/staticinit/*",
    "gtest/core/clingutils/*", "gtest/core/dictgen/*", "gtest/core/metacling/*",
    "pyunittest/core/metacling/*",
    "test/stressinterpreter", "test/check-nullptr", "test/check-invalidptr",
]

[[label]]
reason = "It tests ROOT's reflection of compiled C++ - rootmaps, autoloading, forward declarations, rootcling, genreflex selection, MakeProject and library unloading - which exists only where C++ is compiled and loaded."
ids = [
    "gtest/core/meta/*",
    "roottest/root/meta/autoloading/*", "roottest/root/meta/cmsUnload/*",
    "roottest/root/meta/redeclUnload/*", "roottest/root/meta/loadAllLibs/*",
    "roottest/root/meta/rootmap/*", "roottest/root/meta/rlibmap/*",
    "roottest/root/meta/fwdDecls/*", "roottest/root/meta/rootcling/*",
    "roottest/root/meta/rootcling-modules", "roottest/root/meta/countIncludePaths",
    "roottest/root/meta/genreflex/*", "roottest/root/meta/dictSelection/*",
    "roottest/root/meta/MakeProject/*",
]

[[label]]
reason = "It is cppyy's own test suite, which compiles C++ with ACLiC and binds it through cling."
ids = ["pyunittest/bindings/pyroot/cppyy/*"]

[[label]]
reason = "It drives a web or OpenGL display (ROOT 7's EVE web server), which needs a browser and a display, not a batch run."
ids = ["gtest/graf3d/eve7/*"]

[[label]]
reason = "It runs distributed RDataFrame on Spark or Dask clusters."
ids = ["pyunittest/bindings/distrdf/*", "roottest/python/distrdf/*"]

[[label]]
reason = "It starts or talks to a server (THttpServer, SQL databases), which is a service rather than data analysis."
ids = ["gtest/net/httpsniff/*", "*/sql/*"]

[[label]]
reason = "It needs a CUDA or SYCL device."
ids = ["*cuda*", "*Cuda*", "*CUDA*", "*sycl*", "*SYCL*", "*genvectorx*"]
