site_name: xrdroot
site_description: The ROOT file format in pure Python, over any URL xrdclient can open
site_url: https://example.org/xrdroot/
repo_url: https://github.com/rob-c/xrdroot
copyright: LGPL-3.0-or-later

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode

# Superseded instructions and plans, kept in the repository as a record only.
exclude_docs: |
  history/

nav:
  - Home: index.md
  - ROOT files: root.md
  - Components:
      - Overview: components/index.md
      - C++ standard library: components/cppstd.md
      - C++ translator (pycxx): components/pycxx.md
      - ROOT's interpreter (pycint): components/pycint.md
      - Shared primitives: components/primitives.md
      - Analysis engines: components/analysis.md
      - Files and data frames: components/io.md
      - Geometry and rendering: components/presentation.md
      - ROOT adapters and application: components/applications.md
      - Providers and adapters: components/providers.md
      - Boundary checks: components/boundaries.md
  - Project knowledge:
      - Closing the gap to 750 tutorials: instructions/closing-the-gap-to-750-tutorials-start-from-a-fresh-run-then.md
      - Where the pass counts live: instructions/where-to-read-xrdroot-s-current-pass-counts-and-which-number-is.md
      - Tutorials ROOT vetoes for no display: instructions/running-the-tutorials-root-vetoes-for-no-display-also-vetoed.md
      - Landing work on main: instructions/landing-work-on-main-here-a-worktree-off-origin-main-pushed-at.md
      - Resuming the ROOT ralph loop: instructions/resuming-the-root-ralph-loop-ralph-resume-root-after-checking.md
      - Unlimited ralph iterations: instructions/unlimited-ralph-iterations-maxiterations-0-and-which-place-wins.md
      - Syncing local main after a worktree push: instructions/local-main-drifts-behind-when-you-push-from-a-worktree-sync-it.md
      - The eighteen components from outside: architecture/what-the-eighteen-components-look-like-from-outside-and-which.md
      - /tmp is wiped mid-session: gotchas/tmp-is-wiped-mid-session-keep-root-s-sources-and-every-run.md
      - A canvas macro is each primitive's SavePrimitive: gotchas/a-canvas-macro-is-save-sources-frame-plus-each-primitives-own.md
      - The harness names the first differing line: gotchas/the-harness-reports-the-first-differing-line-not-the-only-one.md
      - A dialect pointer return must carry its star: gotchas/a-dialect-return-type-naming-a-pointer-must-carry-its-star.md
      - An emitter helper that writes belongs on the emit path: gotchas/an-emitter-helper-that-writes-belongs-only-on-the-emit-path.md
      - A probe against a broken tree names a bug that is not there: gotchas/a-probe-taken-against-a-broken-intermediate-tree-names-a-bug.md
      - Both roads numeric makes an integral test pass: gotchas/a-test-that-compares-an-analytic-integral-with-a-numeric-one.md
      - docs_record and mkdocs --strict: gotchas/docs-record-s-docs-readme-md-and-unlisted-notes-break-mkdocs.md
      - Delaunay2D takes no zout and its diagonal is CDT's: gotchas/root-math-delaunay2d-takes-no-zout-and-its-diagonal-comes-from-cdt.md
      - Tutorial work is 2-for-1 on twin pairs: discoveries/tutorial-work-is-2-for-1-on-twin-pairs-roofit-s-text-diffs-have.md
      - TPrincipal and ROOT's LAPACK basis: discoveries/tprincipal-is-implemented-but-principal-s-pca-c-needs-root-s.md
      - Rounds open off main: decisions/rounds-open-off-main-and-merge-back-to-main-the-w0-138.md
  - Maintainability metrics: maintainability.md
  - Maximising passing tests: instructions/maximising-passing-tests-two-counters-ranked-causes-and-the.md
  - Bank the run, not the wish: decisions/bank-the-run-not-the-wish-a-hand-kept-pass-fails-the-ratchet.md
  - Cache hits, never misses: discoveries/cache-hits-never-misses-when-a-dictionary-can-supply-the-answer.md
  - Dictionary classes live in DECLARED: architecture/a-loaded-dictionary-s-classes-are-in-declared-not-in-sys.md
  - A harness bisect lies without its fixture: gotchas/a-bisect-over-harness-tests-lies-unless-each-commit-builds-its.md
  - TProfile2Poly builds bins ROOT does not: discoveries/tprofile2poly-s-constructor-builds-bins-root-does-not-ask-the.md
  - An isolated roottest failure can be a fixture: gotchas/an-isolated-roottest-failure-can-be-a-missing-fixture-not-a.md
  - Do not refresh the baseline under load: gotchas/do-not-refresh-the-suite-baseline-while-the-loop-s-own-gate-is.md
  - An ungated WIP branch can be complete: discoveries/an-ungated-wip-branch-can-be-complete-code-that-never-ran-the.md
  - Auditing a branch backlog: instructions/auditing-a-branch-backlog-git-cherry-then-a-branch-s-tests.md
  - A merge can cost PASSes through cost: discoveries/a-merge-can-cost-passes-through-cost-not-behaviour-profile-the.md
  - A removal returns on the next merge: gotchas/a-deliberate-removal-returns-on-the-next-merge-assert-the.md
  - Instructions:
      - Triage merge conflicts before delegating: instructions/triage-merge-conflicts-mechanically-before-delegating-and-never.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            members_order: source
            filters: ["!^_"]

watch:
  - src/xrdroot
