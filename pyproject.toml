[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xrdroot"
version = "0.1.0"
description = "The ROOT file format in pure Python, read and written over any URL xrdclient can open"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "LGPL-3.0-or-later" }
authors = [{ name = "Robert Currie", email = "robert.andrew.currie@gmail.com" }]
keywords = ["root", "hep", "xrootd", "file-format", "ttree"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Physics",
]
# The transport underneath: every URL a ROOT file is read from here is opened
# through it. Until these layers are on PyPI the requirement names the
# repository it comes from; swap it for a version specifier at first release.
dependencies = [
  "xrdclient @ git+https://github.com/rob-c/xrdclient@80677788959a18e392576e938b6a943d0fbeb95a",
  # Every column, histogram and graph comes back as an array, decoded in C.
  "numpy>=1.22",
]

# ``xrdroot`` is ROOT's prompt and its command-line kit: ``xrdroot f.root``
# is ``root -l f.root``, and ``xrdroot ls``, ``dump``, ``diff``... the rest.
[project.scripts]
xrdroot = "xrdroot.cli:main"

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
# The other two libraries plots are drawn with, and the experiments' styles.
plotly = ["plotly>=5.11"]
bokeh = ["bokeh>=3.1"]
hep = ["mplhep>=0.3"]
lz4 = ["lz4>=4", "xxhash>=3"]
zstd = ["zstandard>=0.21"]
# Minuit, for the fits that are not linear in their parameters: TH1::Fit's
# MIGRAD, HESSE and MINOS, through the Minuit2 C++ iminuit wraps.
fit = ["iminuit>=2.20"]
# A geometry as a 3-D scene: pyvista renders it off-screen (hidden surfaces hidden),
# plotly as a figure to turn round. A pad's picture of one needs neither.
geom = ["pyvista>=0.43", "plotly>=5.11"]
# TMVA's learners: scikit-learn grows the decision trees, the SVM and the
# PyMVA ensembles, SciPy's L-BFGS trains the MLP, XGBoost is what
# SaveXGBoost and RBDT read, and PyTorch - where it has a wheel - trains the
# deep networks (NumPy's own descent does when it does not).
tmva = ["scikit-learn>=1.3", "scipy>=1.10", "xgboost>=2", "torch>=2; platform_machine != 'x86_64' or sys_platform != 'darwin'"]
dev = [
  # The libraries a tree or a histogram can be handed to, so that every one of
  # those hand-overs is exercised by the suite rather than trusted.
  "awkward>=2",
  "boost-histogram>=1.4",
  "hist>=2.7",
  # The C codecs the lz4 extra brings, so the fast paths are the ones tested;
  # the pure-Python ones are tested directly beside them.
  "lz4>=4",
  "xxhash>=3",
  "iminuit>=2.20",
  # Every backend a picture is drawn with, so each is drawn with for real.
  "matplotlib>=3.5",
  "plotly>=5.11",
  "bokeh>=3.1",
  "mplhep>=0.3",
  "pandas>=1.5",
  "polars>=1",
  "pyarrow>=14",
  "complexipy>=6,<7",
  # TMVA's learners, so every method is trained for real; PyTorch is left out,
  # its adapter being tested against a stand-in, as it has no wheel everywhere.
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "xgboost>=2",
  "mypy>=1.10",
  "pytest>=8",
  "pytest-cov",
  "pytest-timeout",
  "pytest-xdist",
  "radon>=6,<7",
  "ruff>=0.5",
]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]

# The layers below are required by repository URL until they are on PyPI,
# and hatchling wants that said out loud.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/xrdroot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# ``tests/test_maintainability.py`` imports ``tools.maintainability``, and a
# bare ``pytest`` - which is what CI runs - does not put the working directory
# on the path the way ``python -m pytest`` does.
pythonpath = ["."]
timeout = 120
# A test that outlasts its time is stopped from a thread of pytest-timeout's
# own, which prints every thread's stack and ends the worker; xdist reports
# the test failed and starts another worker for the rest. The signal method
# would instead raise the failure inside whatever the test was running - and
# under coverage that is often coverage's own tracer, between its taking its
# data lock and giving it back. The lock is then never given back, the next
# line traced waits on it for good, and no timer is left to end the wait: one
# slow test became a run that hung until CI cancelled it.
timeout_method = "thread"
filterwarnings = ["error::ResourceWarning"]

[tool.coverage.run]
branch = true
source = ["xrdroot"]
parallel = true

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "\\.\\.\\.$",
  "if __name__ == .__main__.:",
]
# A gap here is an untested path against somebody's real physics data, so the
# whole package is gated at the full line-and-branch mark.
include = ["*/xrdroot/*"]
fail_under = 100
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "RUF"]
# RUF022/RUF023: ``__all__`` and ``__slots__`` are grouped by meaning here -
# reading, writing, data, errors - with a comment on each group. Alphabetising
# them would trade a reader's map of the package for a sort order nobody reads.
ignore = ["E741", "RUF022", "RUF023"]

[tool.mypy]
# The floor is 3.10, xrdclient's: below it botocore and urllib3>=2.2, both of
# which xrdclient needs, cannot be installed together.
python_version = "3.10"
strict = true
packages = ["xrdroot"]
mypy_path = "src"

# The optional accelerators ship no stubs. They are reached through narrow,
# guarded imports, so untyped is the honest description of them rather than a
# hole in our own checking.
[[tool.mypy.overrides]]
module = ["lz4.*", "zstandard.*", "tensorflow.*", "skimage", "skimage.*"]
ignore_missing_imports = true

# iminuit ships no py.typed marker. It is imported in one place, behind a
# refusal naming the extra that installs it, and everything it hands back is
# turned into NumPy arrays and floats there.
[[tool.mypy.overrides]]
module = ["iminuit", "iminuit.*"]
ignore_missing_imports = true

# TMVA's learners ship no stubs (scikit-learn, SciPy's optimizers, XGBoost)
# or are not always installed (PyTorch). Each is reached inside the method
# that trains with it, and what it hands back is made NumPy arrays there.
[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*", "scipy", "scipy.*", "xgboost", "xgboost.*", "torch", "torch.*"]
ignore_missing_imports = true

# These two are typed but not always there: xxhash comes only with the lz4
# extra, and compression.zstd only with Python 3.14 - where mypy, told to check
# against 3.10, finds it on disk but not in its own copy of the standard
# library, and so calls it untyped. Absent or untyped, the guarded import falls
# back, and that is the same answer on every interpreter.
[[tool.mypy.overrides]]
module = ["xxhash", "xxhash.*", "compression", "compression.*"]
ignore_missing_imports = true

# plotly and mplhep ship no py.typed marker, and bokeh's modules use syntax
# newer than the floor this is checked against. All three are reached only
# inside the backend that draws with them, where everything they hand back
# is the caller's to keep, so none is followed into.
[[tool.mypy.overrides]]
module = ["plotly", "plotly.*", "bokeh", "bokeh.*", "mplhep", "mplhep.*", "pyvista", "pyvista.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_missing_imports = true

# matplotlib drags numpy in, whose stubs use syntax newer than the floor this
# package is checked against; neither is followed into.
[[tool.mypy.overrides]]
module = ["matplotlib", "matplotlib.*", "numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_missing_imports = true


# Internal ownership only: this remains one project and one distribution.
[tool.xrdroot.components]
schema = 1
package = "xrdroot"
source = "src/xrdroot"
baseline = "tools/components-baseline.json"
# Names added after Python 3.10; policy results must not vary with the tooling interpreter.
stdlib = ["compression", "tomllib"]
provider_registry = "xrdroot.plugins"
provider_functions = ["xrdroot.plugins.lookup", "xrdroot.plugins.require", "xrdroot.plugins.lookup_loaded"]
# Upward dispatch is separately reviewed; it never grants a direct import edge.
extensions = [
    { caller = "xrdroot.display", point = "display.plot", provider = "graphics", target = "xrdroot.plot:plot" },
    { caller = "xrdroot.display", point = "display.html", provider = "graphics", target = "xrdroot.plot.notebook:figure" },
    { caller = "xrdroot.file", point = "io.workspace", provider = "roofit", target = "xrdroot.roofit.io.workspace:read_workspace" },
    { caller = "xrdroot.interp", point = "canvas.streamer", provider = "graphics", target = "xrdroot.canvas.streamer:streamer_for" },
    { caller = "xrdroot.kinds", point = "canvas.dress", provider = "graphics", target = "xrdroot.canvas:Canvas" },
    { caller = "xrdroot.kinds", point = "canvas.dress", provider = "graphics", target = "xrdroot.canvas:Pad" },
    { caller = "xrdroot.kinds", point = "canvas.dress", provider = "graphics", target = "xrdroot.canvas:Primitive" },
    { caller = "xrdroot.interp", point = "io.layouts", provider = "histfactory", target = "xrdroot.histfactory.layouts:described" },
    { caller = "xrdroot.roofit.io.workspace", point = "workspace.maker", provider = "roostats", target = "xrdroot.roostats.workspaceio:make_model_config" },
    { caller = "xrdroot.interp", point = "canvas.streamer.custom", provider = "graphics", target = "xrdroot.canvas.streamer:streamer_for" },
    { caller = "xrdroot.kinds", point = "canvas.classes", provider = "graphics", target = "xrdroot.canvas:class_registry" },
    { caller = "xrdroot.roofit.bindings", point = "roofit.binding_name", provider = "pyroot", target = "xrdroot.pyroot.roofit.bindings:registered_name" },
    { caller = "xrdroot.roofit.fitting.contour", point = "root.class", provider = "pyroot", target = "xrdroot.pyroot.graphics.shapes:TMarker" },
    { caller = "xrdroot.roofit.fitting.contour", point = "roofit.contour_graph", provider = "pyroot", target = "xrdroot.pyroot.roofit.contour:make_graph" },
    { caller = "xrdroot.roostats.mcmc", point = "roostats.posterior_hist", provider = "pyroot", target = "xrdroot.pyroot.roostats.mcmcplot:posterior_hist" },
    { caller = "xrdroot.roostats.inverterscan", point = "roostats.inverter_draw", provider = "pyroot", target = "xrdroot.pyroot.roostats.inverterplot:draw_limit_plot" },
    { caller = "xrdroot.roostats.inverterscan", point = "roostats.inverter_plot", provider = "pyroot", target = "xrdroot.pyroot.roostats.inverterplot:make_plot" },
    { caller = "xrdroot.roostats.inverterscan", point = "roostats.inverter_exponential", provider = "pyroot", target = "xrdroot.pyroot.roostats.inverterfits:exponential" },
    { caller = "xrdroot.roostats.inverterlimits", point = "roostats.inverter_error_graph", provider = "pyroot", target = "xrdroot.pyroot.roostats.inverterfits:error_graph" },
    { caller = "xrdroot.roostats.inverterlimits", point = "roostats.inverter_error_fit", provider = "pyroot", target = "xrdroot.pyroot.roostats.inverterfits:fitted_error" },
    { caller = "xrdroot.histfactory.channel", point = "histfactory.count_data", provider = "pyroot", target = "xrdroot.pyroot.roostats.histfactoryio:counting_data" },
    { caller = "xrdroot.histfactory.model", point = "histfactory.read_histogram", provider = "pyroot", target = "xrdroot.pyroot.roostats.histfactoryio:read_histogram" },
    { caller = "xrdroot.histfactory.model", point = "histfactory.count_sample", provider = "pyroot", target = "xrdroot.pyroot.roostats.histfactoryio:counting_sample" },
    { caller = "xrdroot.histfactory.make", point = "histfactory.write_model", provider = "pyroot", target = "xrdroot.pyroot.roostats.histfactoryio:write_model" },
]

[tool.xrdroot.components.groups]
engines = ["cppstd", "core", "hist", "spectrum", "fits", "io", "rdf", "geom", "graphics", "roofit", "roostats", "histfactory", "tmva"]
facade = ["cppstd", "core", "hist", "spectrum", "fits", "io", "rdf", "geom", "graphics", "roofit", "roostats", "histfactory", "tmva", "pyroot"]

[tool.xrdroot.components.ownership.cppstd]
modules = ["xrdroot.cppstd"]
hard = ["numpy"]

[tool.xrdroot.components.ownership.core]
modules = ["xrdroot.errors", "xrdroot.buffer", "xrdroot.compression", "xrdroot.stdio", "xrdroot.limits", "xrdroot.random", "xrdroot.stats", "xrdroot.numerics", "xrdroot.cxx", "xrdroot.booking", "xrdroot.drawspec", "xrdroot.polybins", "xrdroot.xmldoc", "xrdroot.palette", "xrdroot.delaunay", "xrdroot.graphsmooth", "xrdroot.supsmu", "xrdroot.entries", "xrdroot.draw", "xrdroot.display", "xrdroot.library", "xrdroot.plugins", "xrdroot.jagged", "xrdroot.rootarrays", "xrdroot.notebook", "xrdroot.colors"]
depends = ["cppstd"]
hard = ["numpy", "xrdclient"]
optional = ["lz4", "zstandard", "xxhash", "pandas", "awkward", "pyarrow", "polars", "hist", "boost_histogram"]

[tool.xrdroot.components.ownership.hist]
modules = ["xrdroot.hist", "xrdroot.arithmetic", "xrdroot.compare", "xrdroot.distribution", "xrdroot.efficiency", "xrdroot.filling", "xrdroot.fillrandom", "xrdroot.function", "xrdroot.moments", "xrdroot.profile", "xrdroot.reshaping", "xrdroot.slicing", "xrdroot.graph", "xrdroot.graphmath", "xrdroot.graph2d", "xrdroot.stacks", "xrdroot.sparse", "xrdroot.scatterplot", "xrdroot.formula", "xrdroot.fit", "xrdroot.mathformula"]
depends = ["core"]
hard = ["numpy"]
optional = ["iminuit", "scipy", "hist"]

[tool.xrdroot.components.ownership.spectrum]
modules = ["xrdroot.spectrum"]
depends = ["core"]
hard = ["numpy"]

[tool.xrdroot.components.ownership.fits]
modules = ["xrdroot.fitsio"]
depends = ["core"]
hard = ["numpy"]

[tool.xrdroot.components.ownership.io]
modules = ["xrdroot.file", "xrdroot.streamers", "xrdroot.objects", "xrdroot.interp", "xrdroot.tree", "xrdroot.leaflist", "xrdroot.kinds", "xrdroot.known", "xrdroot.chain", "xrdroot.friends", "xrdroot.winfo", "xrdroot.writer", "xrdroot.wbranch", "xrdroot.wclasses", "xrdroot.wcolumns", "xrdroot.wmeasure", "xrdroot.wobjects", "xrdroot.wpacking", "xrdroot.wtree", "xrdroot.wupdate", "xrdroot.rntuple", "xrdroot.merging", "xrdroot.image", "xrdroot.remote", "xrdroot.drawable", "xrdroot.treedraw", "xrdroot.scan", "xrdroot.extending"]
depends = ["core", "hist"]
hard = ["numpy", "xrdclient"]
optional = ["certifi", "PIL", "zstandard", "lz4", "xxhash", "matplotlib"]

[tool.xrdroot.components.ownership.rdf]
modules = ["xrdroot.rdf"]
depends = ["core", "hist", "io"]
hard = ["numpy"]

[tool.xrdroot.components.ownership.geom]
modules = ["xrdroot.geom"]
depends = ["core"]
hard = ["numpy"]
optional = ["pyvista", "plotly"]

[tool.xrdroot.components.ownership.graphics]
modules = ["xrdroot.canvas", "xrdroot.plot"]
exact = ["xrdroot.geom.paint"]
depends = ["core", "hist", "geom"]
hard = ["numpy"]
optional = ["matplotlib", "plotly", "bokeh", "mplhep", "PIL"]

[tool.xrdroot.components.ownership.roofit]
modules = ["xrdroot.roofit"]
depends = ["core", "hist", "cppstd"]
hard = ["numpy"]
optional = ["scipy", "iminuit"]

[tool.xrdroot.components.ownership.roostats]
modules = ["xrdroot.roostats"]
depends = ["core", "hist", "roofit"]
hard = ["numpy"]
optional = ["scipy", "iminuit"]

[tool.xrdroot.components.ownership.histfactory]
modules = ["xrdroot.histfactory"]
depends = ["core", "hist", "io", "roofit", "roostats"]
hard = ["numpy"]

[tool.xrdroot.components.ownership.tmva]
modules = ["xrdroot.tmva"]
depends = ["core", "hist", "io"]
hard = ["numpy"]
optional = ["sklearn", "scipy", "xgboost", "torch", "tensorflow", "pandas"]

[tool.xrdroot.components.ownership.pyroot]
modules = ["xrdroot.pyroot", "xrdroot.cint", "xrdroot.session"]
depends = ["@engines"]
hard = ["numpy"]
optional = ["matplotlib", "scipy", "iminuit", "PIL", "skimage"]

[tool.xrdroot.components.ownership.app]
modules = ["xrdroot.cli", "xrdroot.__main__"]
exact = ["xrdroot"]
depends = ["@facade"]
hard = ["numpy"]
optional = ["IPython", "matplotlib"]

# Exact source-reviewed dynamic sites. Each target is still checked against the
# ordinary graph and external import policy; prefixes expand only installed
# source modules in this same project. No new dependency is introduced here.
[[tool.xrdroot.components.dynamic]]
caller = "xrdroot.cli"
scope = "_module"
statement = "importlib.import_module(f'{__name__}.{name}')"
prefixes = ["xrdroot.cli"]
reason = "Subcommand dispatch uses COMMANDS and remains within the CLI package."

[[tool.xrdroot.components.dynamic]]
caller = "xrdroot.geom.backends"
scope = "library"
statement = "importlib.import_module('plotly.graph_objects' if name == 'plotly' else name)"
targets = ["plotly.graph_objects", "pyvista"]
reason = "Existing geometry backend callers request plotly or pyvista from PACKAGES."

[[tool.xrdroot.components.dynamic]]
caller = "xrdroot.library"
scope = "_module"
statement = "importlib.import_module(package)"
targets = ["pandas", "awkward", "pyarrow", "polars"]
reason = "PACKAGES[name] selects the four existing optional column libraries."

[[tool.xrdroot.components.dynamic]]
caller = "xrdroot.plot.backends"
scope = "backend"
statement = "importlib.import_module(needs)"
targets = ["matplotlib", "plotly", "bokeh"]
reason = "BACKENDS supplies the guarded optional backend requirement."

[[tool.xrdroot.components.dynamic]]
caller = "xrdroot.plot.backends"
scope = "backend"
statement = "importlib.import_module(f'{__name__}.{module}')"
prefixes = ["xrdroot.plot.backends"]
reason = "The fixed BACKENDS table names only modules beneath this backend package."

[[tool.xrdroot.components.dynamic]]
caller = "xrdroot.pyroot"
scope = "_gather"
statement = "importlib.util.find_spec(f'{__name__}.{module}')"
prefixes = ["xrdroot.pyroot"]
reason = "SUBMODULES enumerates ROOT namespace families within pyroot."

[[tool.xrdroot.components.dynamic]]
caller = "xrdroot.pyroot"
scope = "_gather"
statement = "importlib.import_module(f'{__name__}.{module}')"
prefixes = ["xrdroot.pyroot"]
reason = "The same fixed SUBMODULES table drives namespace loading after its probe."

[[tool.xrdroot.components.dynamic]]
caller = "xrdroot.pyroot.core"
scope = "_gather"
statement = "importlib.import_module(f'{__name__}.{family}')"
prefixes = ["xrdroot.pyroot.core"]
reason = "FAMILIES enumerates core wrapper families in this same package."

[[tool.xrdroot.components.dynamic]]
caller = "xrdroot.pyroot.core.troot"
scope = "_graphics"
statement = "importlib.util.find_spec(name)"
prefixes = ["xrdroot.pyroot.graphics"]
reason = "The graphics resolver starts at xrdroot.pyroot.graphics and descends attributes."

[[tool.xrdroot.components.dynamic]]
caller = "xrdroot.pyroot.core.troot"
scope = "_graphics"
statement = "importlib.import_module(name)"
prefixes = ["xrdroot.pyroot.graphics"]
reason = "The graphics resolver imports the same wrapper namespace it probes."

[[tool.xrdroot.components.dynamic]]
caller = "xrdroot.pyroot.core.troot"
scope = "_submodule"
statement = "importlib.import_module(name)"
prefixes = ["xrdroot.pyroot.graphics"]
reason = "_graphics alone delegates namespace descent to this private helper."

[[tool.xrdroot.components.dynamic]]
caller = "xrdroot.roofit.io.models"
scope = "_simple.make"
statement = "importlib.import_module(f'xrdroot.roofit.{module}')"
prefixes = ["xrdroot.roofit"]
reason = "The fixed simple-model maker table selects RooFit implementation modules."

[[tool.xrdroot.components.dynamic]]
caller = "xrdroot.roofit.registry"
scope = "classes"
statement = "importlib.import_module(f'xrdroot.roofit.{module}')"
prefixes = ["xrdroot.roofit"]
reason = "MODULES enumerates classes owned by the RooFit engine."

[[tool.xrdroot.components.dynamic]]
caller = "xrdroot.roostats.registry"
scope = "members"
statement = "importlib.import_module(f'xrdroot.roostats.{module}')"
prefixes = ["xrdroot.roostats"]
reason = "MODULES enumerates members owned by the RooStats engine."

[[tool.xrdroot.components.dynamic]]
caller = "xrdroot.tmva.methods.pymva"
scope = "_PyMethod._made"
statement = "importlib.import_module(module)"
targets = ["sklearn.ensemble"]
reason = "The three supported concrete estimators all select sklearn.ensemble."

# This exact established low-level call preserves ROOT Contour's error-level behavior.
[[tool.xrdroot.components.private_imports]]
caller = "xrdroot.fit.minuit"
scope = "contour"
statement = "from iminuit._core import MnContours"
target = "iminuit._core"
reason = "ROOT Contour uses the minimum's exact error level; the public mncontour rescales confidence and can recompute HESSE. Preserve the existing algorithm."
