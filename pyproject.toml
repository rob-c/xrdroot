[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xrdroot"
version = "0.1.0"
description = "The ROOT file format in pure Python, read and written over any URL xrdclient can open"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "LGPL-3.0-or-later" }
authors = [{ name = "Robert Currie", email = "robert.andrew.currie@gmail.com" }]
keywords = ["root", "hep", "xrootd", "file-format", "ttree"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Physics",
]
# The transport underneath: every URL a ROOT file is read from here is opened
# through it. Until these layers are on PyPI the requirement names the
# repository it comes from; swap it for a version specifier at first release.
dependencies = [
  "xrdclient @ git+https://github.com/rob-c/xrdclient@main",
  # Every column, histogram and graph comes back as an array, decoded in C.
  "numpy>=1.22",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
lz4 = ["lz4>=4", "xxhash>=3"]
zstd = ["zstandard>=0.21"]
dev = [
  # The libraries a tree or a histogram can be handed to, so that every one of
  # those hand-overs is exercised by the suite rather than trusted.
  "awkward>=2",
  "boost-histogram>=1.4",
  "hist>=2.7",
  "pandas>=1.5",
  "polars>=1",
  "pyarrow>=14",
  "complexipy>=6,<7",
  "mypy>=1.10",
  "pytest>=8",
  "pytest-cov",
  "pytest-timeout",
  "pytest-xdist",
  "radon>=6,<7",
  "ruff>=0.5",
]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]

# The layers below are required by repository URL until they are on PyPI,
# and hatchling wants that said out loud.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/xrdroot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# ``tests/test_maintainability.py`` imports ``tools.maintainability``, and a
# bare ``pytest`` - which is what CI runs - does not put the working directory
# on the path the way ``python -m pytest`` does.
pythonpath = ["."]
timeout = 120
filterwarnings = ["error::ResourceWarning"]

[tool.coverage.run]
branch = true
source = ["xrdroot"]
parallel = true

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "\\.\\.\\.$",
  "if __name__ == .__main__.:",
]
# A gap here is an untested path against somebody's real physics data, so the
# whole package is gated at the full line-and-branch mark.
include = ["*/xrdroot/*"]
fail_under = 100
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "RUF"]
# RUF022/RUF023: ``__all__`` and ``__slots__`` are grouped by meaning here -
# reading, writing, data, errors - with a comment on each group. Alphabetising
# them would trade a reader's map of the package for a sort order nobody reads.
ignore = ["E741", "RUF022", "RUF023"]

[tool.mypy]
# The floor is 3.9 - what RHEL 9 and AlmaLinux 9 ship - but mypy itself refuses
# to be pointed below 3.10, so the floor is held by the interpreter instead:
# CI runs the suite on a real 3.9.
python_version = "3.10"
strict = true
packages = ["xrdroot"]
mypy_path = "src"

# The optional accelerators ship no stubs. They are reached through narrow,
# guarded imports, so untyped is the honest description of them rather than a
# hole in our own checking.
[[tool.mypy.overrides]]
module = ["lz4.*", "zstandard.*", "tensorflow.*"]
ignore_missing_imports = true

# These two are typed but not always there: xxhash comes only with the lz4
# extra, and compression.zstd only with Python 3.14 - where mypy, told to check
# against 3.10, finds it on disk but not in its own copy of the standard
# library, and so calls it untyped. Absent or untyped, the guarded import falls
# back, and that is the same answer on every interpreter.
[[tool.mypy.overrides]]
module = ["xxhash", "xxhash.*", "compression", "compression.*"]
ignore_missing_imports = true

# matplotlib drags numpy in, whose stubs use syntax newer than the floor this
# package is checked against; neither is followed into.
[[tool.mypy.overrides]]
module = ["matplotlib", "matplotlib.*", "numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_missing_imports = true
