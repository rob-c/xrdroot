# This compatibility name is the very same module, including its globals.
[tool.xrdroot.components.module_aliases."xrdroot.pyroot.stl"]
target = "xrdroot.cppstd.containers"
reason = "Legacy setattr and vars(stl) writes must reach the generic container implementation dictionary."

[[tool.xrdroot.components.private_imports]]
caller = "xrdroot.fit.minuit"
scope = "contour"
statement = "from iminuit._core import MnContours"
target = "iminuit._core"
reason = "ROOT Contour uses the minimum's exact error level; the public mncontour rescales confidence and can recompute HESSE. Preserve the existing algorithm."

[[tool.xrdroot.components.private_imports]]
caller = "xrdroot.fit.minuit"
scope = "core"
statement = "import iminuit._core as module"
target = "iminuit._core"
reason = "ROOT::Minuit2's API (MnMigrad, MnMinos, MnUserParameterState, FunctionMinimum) is Minuit2's C++, which iminuit binds there; its public Minuit class hides those classes."

# Callback injection is an explicit adapter edge, never a generic upward import.
[tool.xrdroot.components.registration_functions."xrdroot.cppstd.containers.set_type_resolver"]
position = 0
keyword = "resolver"
[tool.xrdroot.components.registration_functions."xrdroot.cppstd.vectorassign.register_capacity"]
position = 1
keyword = "growth"
[tool.xrdroot.components.registration_functions."xrdroot.cppstd.cmath.set_vector_result"]
position = 0
keyword = "constructor"

[[tool.xrdroot.components.registrations]]
caller = "xrdroot.pyroot.stl"
scope = ""
statement = "_generic.set_type_resolver(_resolve_root_type)"
callee = "xrdroot.cppstd.containers.set_type_resolver"
callback = "xrdroot.pyroot.stl:_resolve_root_type"
reason = "The ROOT adapter supplies explicit opaque-type resolution; generic containers never discover ROOT."

[[tool.xrdroot.components.registrations]]
caller = "xrdroot.pyroot.vectorassign"
scope = ""
statement = "_register_capacity('rvec', _rvec_capacity)"
callee = "xrdroot.cppstd.vectorassign.register_capacity"
callback = "xrdroot.pyroot.vectorassign:_rvec_capacity"
reason = "The adapter supplies ROOT SmallVector growth and signed capacity bounds to generic assignment."

[[tool.xrdroot.components.registrations]]
caller = "xrdroot.pycint.runtime.adapters"
scope = ""
statement = "_cmath.set_vector_result(_rvec)"
callee = "xrdroot.cppstd.cmath.set_vector_result"
callback = "xrdroot.pycint.runtime.adapters:_rvec"
reason = "The interpreter supplies its lazy RVec constructor while generic math returns ordinary arrays."
